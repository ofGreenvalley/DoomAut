<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אֲבַדוֹן — DOOM</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<section id="entry">
  <div class="entry-bg"></div>
  <div class="glitch"></div>
  <button class="press" id="enterBtn" aria-label="Entrar">PRESS</button>
</section>

<div id="transition"></div>

<main id="main">
  <div class="main-bg"></div>

  <img
    class="doom-image"
    src="https://u.cubeupload.com/Eradicater/87e51937283878e8fd72.jpg"
    alt="Doom"
  >

  <div class="avt-hologram" aria-label="AVT condicion — caos del multiverso">
    <div class="avt-title">AVT CONDICION</div>
    <div class="avt-grid"></div>
    <div class="planet planet-a"></div>
    <div class="planet planet-b"></div>
    <div class="planet planet-c"></div>
    <div class="impact impact-a"></div>
    <div class="impact impact-b"></div>
    <div class="holo-noise"></div>
  </div>

  <section class="content">
    <div class="center">

      <h1 class="title">אֲבַדוֹן</h1>

      <div style="display:flex;align-items:center;">
        <div class="runebox">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᛃ ᛇ ᛈ ᛉ ᛋ ᛏ</div>
        <button class="plus" id="plusBtn" aria-label="Abrir menú">+</button>
      </div>

      <nav class="menu" id="menu">
        <button data-panel="aboutPanel">ABOUT ME</button>
        <button data-panel="friendsPanel">FRIENDS</button>
        <button data-panel="backAction">COME BACK</button>
      </nav>

      <div class="panel" id="aboutPanel">
        <div class="about">𝙴𝚕 𝚒𝚗𝚏𝚒𝚎𝚛𝚗𝚘 𝚖𝚎 𝚘𝚎𝚍𝚎𝚌𝚎, 𝚙𝚞𝚎𝚜 𝚜𝚘𝚢 𝙳𝚘𝚘𝚖.</div>
      </div>

      <div class="panel friends" id="friendsPanel">
        <a href="https://xat.me/iLuguinhoo" target="_blank" rel="noopener">Lugo</a>
        <a href="https://xat.me/Honeymoon" target="_blank" rel="noopener">MAR</a>
        <a href="https://xat.me/Estela" target="_blank" rel="noopener">Estela</a>
        <a href="https://xat.me/Nyxess" target="_blank" rel="noopener">Gabi</a>
      </div>

      <div class="audio">
        <div class="track">SE LO JURO MOR — FEID</div>
        <div class="mini-player">
          <button class="play-mini" id="playBtn" type="button" aria-label="Reproducir o pausar">▶</button>
          <div class="progress-wrap">
            <div class="progress"><span id="progressBar"></span></div>
            <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
          </div>
        </div>
        <audio id="player" preload="auto">
          <source src="https://github.com/ofGreenvalley/feid/raw/refs/heads/main/Se%20Lo%20Juro%20Mor%20-%20Feid%20%28Letra%29.mp3" type="audio/mpeg">
        </audio>
      </div>

    </div>
  </section>
</main>

<script src="functions.js"></script>

</body>
</html>
