<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אֲבַדוֹן — DOOM</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&display=swap');

:root{
  --green:#67ff9b;
  --green-soft:rgba(103,255,155,.55);
  --white:#e9eee9;
  --gray:#aeb5b0;
  --line:rgba(220,230,225,.20);
}

*{box-sizing:border-box;margin:0;padding:0}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100svh;
}

/* ---------- ENTRY ---------- */

#entry{
  position:fixed;
  inset:0;
  z-index:50;
  display:grid;
  place-items:center;
  overflow:hidden;
  background:#000;
}

.entry-bg{
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle at center, rgba(40,255,130,.08), transparent 34%),
    linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,.64)),
    url("https://u.cubeupload.com/Eradicater/dieguito.jpg");
  background-position:center;
  background-repeat:no-repeat;
  background-size:100% 100%, 100% 100%, clamp(320px, 78vw, 900px) auto;
  filter:grayscale(.18) brightness(.52) contrast(1.12);
  opacity:.84;
  transition:filter .7s ease,opacity .7s ease,transform 1.1s ease;
}

#entry:hover .entry-bg{
  filter:grayscale(.05) brightness(.62) contrast(1.08);
  opacity:.88;
  transform:scale(1.015);
}

/* subtle multiverse glitch */
.glitch{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.52;
  mix-blend-mode:screen;
  background:
    linear-gradient(90deg,transparent 0 46%,rgba(103,255,155,.22) 46.0% 46.45%,transparent 46.8% 100%),
    repeating-linear-gradient(0deg,transparent 0 5px,rgba(103,255,155,.075) 6px 7px,transparent 8px 12px);
  animation:glitchShift 4.8s steps(2,end) infinite;
}

.glitch:after{
  content:"";
  position:absolute;
  inset:-10%;
  background:linear-gradient(90deg,transparent,rgba(103,255,155,.13),transparent);
  transform:translateX(-100%);
  animation:scan 5.5s linear infinite;
}

@keyframes glitchShift{
  0%,92%,100%{transform:translate(0);filter:none}
  93%{transform:translate(2px,-1px);filter:hue-rotate(40deg)}
  94%{transform:translate(-3px,1px)}
  95%{transform:translate(0)}
}

@keyframes scan{
  to{transform:translateX(100%)}
}

.press{
  position:relative;
  width:76px;
  height:76px;
  border-radius:50%;
  border:1px solid rgba(210,220,215,.48);
  background:rgba(0,0,0,.42);
  color:#dce5df;
  display:grid;
  place-items:center;
  font:500 10px/1 Arial,Helvetica,sans-serif;
  letter-spacing:3px;
  cursor:pointer;
  text-transform:uppercase;
  box-shadow:0 0 0 1px rgba(103,255,155,.06),0 0 30px rgba(103,255,155,.08);
  transition:transform .35s ease,border-color .35s ease,box-shadow .35s ease,color .35s ease;
}

.press:before,
.press:after{
  content:"";
  position:absolute;
  inset:-8px;
  border-radius:50%;
  border:1px solid rgba(103,255,155,.16);
  transition:transform .4s ease,opacity .4s ease;
}

.press:after{
  inset:-17px;
  opacity:.32;
  border-style:dashed;
}

.press:hover{
  transform:scale(1.08);
  border-color:var(--green);
  color:#fff;
  box-shadow:0 0 28px rgba(103,255,155,.18);
}

.press:hover:before{transform:rotate(90deg) scale(1.08)}
.press:hover:after{transform:rotate(-60deg);opacity:.6}

/* ---------- MAIN ---------- */

#main{
  position:fixed;
  inset:0;
  opacity:0;
  visibility:hidden;
  background:#020303;
  transition:opacity 1.2s ease,visibility 0s linear 1.2s;
}

#main.show{
  opacity:1;
  visibility:visible;
  transition:opacity 1.2s ease;
}

.main-bg{
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 54% 50%,rgba(103,255,155,.045),transparent 30%),
    linear-gradient(90deg,rgba(0,0,0,.97) 0%,rgba(0,0,0,.78) 52%,rgba(0,0,0,.30) 100%);
}

.doom-image{
  position:absolute;
  right:2.5vw;
  top:0;
  height:100%;
  width:min(46vw,650px);
  object-fit:cover;
  object-position:center;
  filter:grayscale(1) brightness(.38) contrast(1.1);
  opacity:.28;
  transition:filter .9s ease,opacity .9s ease,transform 1s ease;
  -webkit-mask-image:linear-gradient(to left,black 65%,transparent 100%);
  mask-image:linear-gradient(to left,black 65%,transparent 100%);
}

.doom-image:hover{
  filter:grayscale(0) brightness(.75) contrast(1.02);
  opacity:.82;
  transform:scale(1.012);
}

.content{
  position:relative;
  z-index:3;
  width:min(1100px,90vw);
  height:100%;
  margin:auto;
  display:flex;
  align-items:center;
  padding:8vh 4vw;
}

.center{
  width:min(520px,72vw);
  margin-left:8vw;
}

.title{
  font-family:Cinzel,Georgia,serif;
  font-size:clamp(40px,6vw,76px);
  font-weight:500;
  letter-spacing:9px;
  color:#e3e7e3;
  text-shadow:0 0 18px rgba(255,255,255,.05);
  margin-bottom:22px;
}

.runebox{
  display:flex;
  align-items:center;
  width:min(330px,58vw);
  min-height:40px;
  padding:8px 12px;
  border:1px solid rgba(210,220,215,.17);
  background:rgba(0,0,0,.25);
  color:rgba(220,225,221,.67);
  font-family:"Times New Roman",serif;
  font-size:16px;
  letter-spacing:4px;
  white-space:nowrap;
  overflow:hidden;
}

.plus{
  width:34px;
  height:34px;
  margin-left:13px;
  border:1px solid rgba(220,230,225,.25);
  background:rgba(0,0,0,.28);
  color:#dfe7e1;
  cursor:pointer;
  font-size:23px;
  font-weight:300;
  transition:.3s ease;
}

.plus:hover,.plus.active{
  color:var(--green);
  border-color:rgba(103,255,155,.6);
  box-shadow:0 0 18px rgba(103,255,155,.12);
}

.panel{
  max-height:0;
  opacity:0;
  overflow:hidden;
  transition:max-height .6s ease,opacity .45s ease,margin-top .45s ease;
}

.panel.open{
  max-height:260px;
  opacity:1;
  margin-top:25px;
}

.menu{
  display:flex;
  gap:18px;
  max-height:0;
  opacity:0;
  overflow:hidden;
  transform:translateY(-6px);
  transition:max-height .45s ease,opacity .35s ease,transform .45s ease,margin-top .35s ease;
}

.menu.open{
  max-height:55px;
  opacity:1;
  transform:translateY(0);
  margin-top:16px;
}

.menu button{
  appearance:none;
  border:0;
  border-bottom:1px solid rgba(220,230,225,.25);
  background:transparent;
  color:#bfc7c1;
  padding:5px 0;
  font:12px/1 Helvetica,Arial,sans-serif;
  letter-spacing:1.8px;
  cursor:pointer;
  transition:.3s ease;
}

.menu button:hover,
.menu button.active{
  color:var(--green);
  border-color:var(--green);
}

.about{
  color:#c8ceca;
  font-family:Helvetica,Arial,sans-serif;
  font-size:15px;
  letter-spacing:.6px;
  line-height:1.7;
}

.friends a{
  display:block;
  width:max-content;
  color:#c94a4a;
  text-decoration:none;
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;
  font-weight:400;
  font-size:14px;
  letter-spacing:1.6px;
  padding:5px 0;
  border-bottom:1px solid rgba(201,74,74,.28);
  transition:.3s ease;
}

.friends a:hover{
  color:#f06a6a;
  border-color:rgba(240,106,106,.75);
  transform:translateX(5px);
}

.audio{
  margin-top:28px;
  width:min(285px,58vw);
  padding-top:9px;
  border-top:1px solid rgba(220,230,225,.14);
}

.track{
  color:#bfc7c1;
  font:12px/1.4 Helvetica,Arial,sans-serif;
  letter-spacing:1px;
  margin-bottom:6px;
  font-size:10px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

audio{display:none}

.mini-player{
  width:min(260px,58vw);
  display:flex;
  align-items:center;
  gap:10px;
}

.play-mini{
  flex:0 0 28px;
  width:28px;
  height:28px;
  border-radius:50%;
  border:1px solid rgba(220,230,225,.28);
  background:transparent;
  color:#dfe6e1;
  font-size:9px;
  cursor:pointer;
  transition:.3s ease;
}

.play-mini:hover{
  color:var(--green);
  border-color:rgba(103,255,155,.65);
  box-shadow:0 0 14px rgba(103,255,155,.10);
}

.progress-wrap{flex:1;min-width:0}

.progress{
  position:relative;
  height:2px;
  width:100%;
  background:rgba(220,230,225,.16);
  cursor:pointer;
}

.progress span{
  position:absolute;
  left:0;
  top:0;
  height:100%;
  width:0;
  background:rgba(103,255,155,.72);
  transition:width .08s linear;
}

.time-row{
  display:flex;
  justify-content:space-between;
  margin-top:5px;
  color:rgba(190,200,194,.55);
  font:8px/1 Helvetica,Arial,sans-serif;
  letter-spacing:.5px;
}


/* ---------- AVT HOLOGRAM ---------- */
.avt-hologram{
  position:absolute;
  z-index:2;
  right:clamp(8vw,13vw,190px);
  top:50%;
  width:clamp(150px,17vw,235px);
  height:clamp(100px,12vw,155px);
  transform:translateY(-50%) perspective(500px) rotateY(-7deg);
  overflow:hidden;
  border:1px solid rgba(103,255,155,.34);
  background:linear-gradient(135deg,rgba(5,28,18,.28),rgba(0,0,0,.10));
  box-shadow:inset 0 0 28px rgba(103,255,155,.08),0 0 22px rgba(103,255,155,.08);
  opacity:.78;
  mix-blend-mode:screen;
  pointer-events:none;
  animation:holoFlicker 4.2s steps(2,end) infinite;
}

.avt-hologram:before{
  content:"";
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(0deg,transparent 0 5px,rgba(103,255,155,.09) 6px 7px);
  opacity:.7;
}

.avt-hologram:after{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid rgba(103,255,155,.12);
  box-shadow:0 0 0 1px rgba(103,255,155,.05) inset;
  clip-path:polygon(0 0,100% 0,100% 82%,93% 100%,7% 100%,0 82%);
}

.avt-title{
  position:absolute;
  left:10px;
  top:8px;
  z-index:5;
  color:rgba(177,255,205,.84);
  font:500 8px/1 Arial,Helvetica,sans-serif;
  letter-spacing:2.2px;
  text-shadow:0 0 8px rgba(103,255,155,.55);
}

.avt-signature{
  position:absolute;
  right:9px;
  bottom:7px;
  z-index:5;
  color:rgba(177,255,205,.72);
  font:500 7px/1 Arial,Helvetica,sans-serif;
  letter-spacing:1.6px;
  text-shadow:0 0 7px rgba(103,255,155,.45);
}

.avt-grid{
  position:absolute;
  left:50%;
  top:55%;
  width:78%;
  height:65%;
  transform:translate(-50%,-50%) rotateX(62deg);
  background:repeating-linear-gradient(90deg,rgba(103,255,155,.16) 0 1px,transparent 1px 18px),repeating-linear-gradient(0deg,rgba(103,255,155,.13) 0 1px,transparent 1px 16px);
  mask-image:radial-gradient(ellipse,black 10%,transparent 72%);
}

.planet{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle at 32% 28%,rgba(240,255,246,.85) 0 5%,rgba(103,255,155,.75) 16%,rgba(25,110,70,.65) 48%,rgba(0,0,0,.15) 70%);
  box-shadow:0 0 10px rgba(103,255,155,.32),inset -7px -5px 12px rgba(0,0,0,.45);
}

.planet-a{width:42px;height:42px;left:29%;top:39%;animation:planetA 3.8s ease-in-out infinite}
.planet-b{width:31px;height:31px;left:51%;top:43%;animation:planetB 3.8s ease-in-out infinite}
.planet-c{width:18px;height:18px;left:42%;top:25%;opacity:.72;animation:planetC 2.8s ease-in-out infinite}

.impact{
  position:absolute;
  left:48%;
  top:54%;
  width:4px;
  height:4px;
  border-radius:50%;
  background:rgba(224,255,235,.95);
  box-shadow:0 0 8px 2px rgba(103,255,155,.8);
}

.impact-a{animation:impactA 3.8s ease-in-out infinite}
.impact-b{animation:impactB 3.8s ease-in-out infinite}

.holo-noise{
  position:absolute;
  inset:0;
  background:linear-gradient(90deg,transparent 0 28%,rgba(103,255,155,.18) 29% 30%,transparent 31% 63%,rgba(103,255,155,.14) 64% 65%,transparent 66%);
  opacity:.35;
  animation:noiseShift 1.7s steps(3,end) infinite;
}

@keyframes planetA{0%,100%{transform:translate(-18px,4px) scale(.9)}45%,58%{transform:translate(9px,-2px) scale(1.02)}65%{transform:translate(0,0) scale(.96)}}
@keyframes planetB{0%,100%{transform:translate(18px,-3px) scale(.85)}45%,58%{transform:translate(-7px,2px) scale(1)}65%{transform:translate(2px,0) scale(.9)}}
@keyframes planetC{0%,100%{transform:translate(0,-5px);opacity:.35}50%{transform:translate(-10px,9px);opacity:.8}70%{transform:translate(8px,0);opacity:.35}}
@keyframes impactA{0%,35%{transform:scale(0);opacity:0}48%{transform:translate(-14px,-2px) scale(1);opacity:1}56%{transform:translate(10px,1px) scale(1.7);opacity:.8}70%,100%{transform:scale(0);opacity:0}}
@keyframes impactB{0%,52%{transform:scale(0);opacity:0}60%{transform:translate(10px,-8px) scale(1);opacity:.8}72%{transform:translate(-16px,7px) scale(1.5);opacity:.5}82%,100%{transform:scale(0);opacity:0}}
@keyframes noiseShift{0%,100%{transform:translateX(-8%);opacity:.22}35%{transform:translateX(13%);opacity:.45}68%{transform:translateX(-3%);opacity:.3}}
@keyframes holoFlicker{0%,92%,100%{opacity:.78;filter:none}93%{opacity:.52;filter:contrast(1.5)}94%{opacity:.9;transform:translateY(-50%) translateX(2px) perspective(500px) rotateY(-7deg)}95%{opacity:.68;transform:translateY(-50%) perspective(500px) rotateY(-7deg)}}

/* ---------- transition ---------- */

#transition{
  position:fixed;
  inset:0;
  z-index:100;
  pointer-events:none;
  opacity:0;
  background:
    repeating-linear-gradient(0deg,transparent 0 5px,rgba(103,255,155,.12) 6px 7px),
    linear-gradient(90deg,transparent,rgba(103,255,155,.15),transparent);
}

#transition.play{
  animation:transitionGlitch 1.15s ease forwards;
}

@keyframes transitionGlitch{
  0%{opacity:0;transform:scale(1)}
  18%{opacity:.85;transform:translateX(-7px)}
  35%{opacity:.45;transform:translateX(9px)}
  55%{opacity:.9;transform:translateX(-4px) scale(1.02)}
  75%{opacity:.3}
  100%{opacity:0;transform:scale(1.08)}
}

@media(max-width:700px){
  .content{
    padding:9vh 7vw;
    align-items:flex-start;
    padding-top:16vh;
  }

  .center{
    margin-left:0;
    width:88vw;
  }

  .doom-image{
    width:100vw;
    right:-22vw;
    opacity:.22;
    -webkit-mask-image:linear-gradient(to left,black 25%,transparent 90%);
    mask-image:linear-gradient(to left,black 25%,transparent 90%);
  }

  .title{
    font-size:clamp(35px,11vw,58px);
    letter-spacing:6px;
  }

  .runebox{width:62vw;min-height:34px;padding:7px 9px;font-size:13px;letter-spacing:3px}
  .audio{width:58vw;min-width:210px}
}

@media(max-width:700px){

  .avt-hologram{
    right:5vw;
    top:25%;
    width:150px;
    height:100px;
    transform:translateY(-50%) perspective(500px) rotateY(-5deg);
    opacity:.58;
  }
 }

@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

<body>

<section id="entry">
  <div class="entry-bg"></div>
  <div class="glitch"></div>
  <button class="press" id="enterBtn" aria-label="Entrar">PRESS</button>
</section>

<div id="transition"></div>

<main id="main">
  <div class="main-bg"></div>

  <img
    class="doom-image"
    src="https://u.cubeupload.com/Eradicater/87e51937283878e8fd72.jpg"
    alt="Doom"
  >

  <div class="avt-hologram" aria-label="AVT condicion — caos del multiverso">
    <div class="avt-title">AVT CONDICION</div>
    <div class="avt-signature">© FEID</div>
    <div class="avt-grid"></div>
    <div class="planet planet-a"></div>
    <div class="planet planet-b"></div>
    <div class="planet planet-c"></div>
    <div class="impact impact-a"></div>
    <div class="impact impact-b"></div>
    <div class="holo-noise"></div>
  </div>

  <section class="content">
    <div class="center">

      <h1 class="title">אֲבַדוֹן</h1>

      <div style="display:flex;align-items:center;">
        <div class="runebox">ᚠ ᚢ ᚦ ᚨ ᚱ ᚲ ᚷ ᚹ ᚺ ᛃ ᛇ ᛈ ᛉ ᛋ ᛏ</div>
        <button class="plus" id="plusBtn" aria-label="Abrir menú">+</button>
      </div>

      <nav class="menu" id="menu">
        <button data-panel="aboutPanel" aria-label="About me">+</button>
        <button data-panel="friendsPanel" aria-label="Friends">ᚠ ᚢ ᚦ</button>
        <button data-panel="backAction" aria-label="Volver">↩</button>
      </nav>

      <div class="panel" id="aboutPanel">
        <div class="about">“𝙴𝚕 𝚒𝚗𝚏𝚒𝚎𝚛𝚗𝚘 𝚖𝚎 𝚘𝚎𝚍𝚎𝚌𝚎, 𝚙𝚞𝚎𝚜 𝚜𝚘𝚢 𝙳𝚘𝚘𝚖.”</div>
      </div>

      <div class="panel friends" id="friendsPanel">
        <a href="https://xat.me/iLuguinhoo" target="_blank" rel="noopener">Lugo</a>
        <a href="https://xat.me/Honeymoon" target="_blank" rel="noopener">MAR</a>
        <a href="https://xat.me/Estela" target="_blank" rel="noopener">Estela</a>
        <a href="https://xat.me/Nyxess" target="_blank" rel="noopener">Gabi</a>
      </div>

      <div class="audio">
        <div class="track">SE LO JURO MOR — FEID</div>
        <div class="mini-player">
          <button class="play-mini" id="playBtn" type="button" aria-label="Reproducir o pausar">▶</button>
          <div class="progress-wrap">
            <div class="progress"><span id="progressBar"></span></div>
            <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
          </div>
        </div>
        <audio id="player" preload="auto">
          <source src="https://github.com/ofGreenvalley/feid/raw/refs/heads/main/Se%20Lo%20Juro%20Mor%20-%20Feid%20%28Letra%29.mp3" type="audio/mpeg">
        </audio>
      </div>

    </div>
  </section>
</main>

<script>
const entry = document.getElementById("entry");
const main = document.getElementById("main");
const transition = document.getElementById("transition");
const enterBtn = document.getElementById("enterBtn");
const plusBtn = document.getElementById("plusBtn");
const menu = document.getElementById("menu");
const player = document.getElementById("player");
const panels = {
  aboutPanel: document.getElementById("aboutPanel"),
  friendsPanel: document.getElementById("friendsPanel")
};

let menuOpen = false;

enterBtn.addEventListener("click", async () => {
  transition.classList.remove("play");
  void transition.offsetWidth;
  transition.classList.add("play");

  entry.style.transition = "opacity .7s ease";
  entry.style.opacity = "0";
  entry.style.pointerEvents = "none";

  setTimeout(() => {
    main.classList.add("show");
  }, 360);

  /* La pulsación de PRESS permite intentar el autoplay. */
  try {
    await player.play();
    playBtn.textContent = "Ⅱ";
  } catch(e) {
    playBtn.textContent = "▶";
  }

  setTimeout(() => {
    entry.style.display = "none";
  }, 900);
});

plusBtn.addEventListener("click", () => {
  menuOpen = !menuOpen;
  menu.classList.toggle("open", menuOpen);
  plusBtn.classList.toggle("active", menuOpen);
  plusBtn.textContent = menuOpen ? "−" : "+";
});

const playBtn = document.getElementById("playBtn");
const progress = document.querySelector(".progress");
const progressBar = document.getElementById("progressBar");
const currentTimeEl = document.getElementById("currentTime");
const durationEl = document.getElementById("duration");

function fmtTime(seconds){
  if(!Number.isFinite(seconds)) return "0:00";
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

playBtn.addEventListener("click", async () => {
  if(player.paused){
    try{
      await player.play();
      playBtn.textContent = "Ⅱ";
    }catch(e){}
  }else{
    player.pause();
    playBtn.textContent = "▶";
  }
});

player.addEventListener("loadedmetadata", () => {
  durationEl.textContent = fmtTime(player.duration);
});

player.addEventListener("timeupdate", () => {
  currentTimeEl.textContent = fmtTime(player.currentTime);
  const pct = player.duration ? (player.currentTime / player.duration) * 100 : 0;
  progressBar.style.width = `${pct}%`;
});

player.addEventListener("play", () => playBtn.textContent = "Ⅱ");
player.addEventListener("pause", () => playBtn.textContent = "▶");

progress.addEventListener("click", (event) => {
  if(!Number.isFinite(player.duration) || player.duration <= 0) return;
  const rect = progress.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
  player.currentTime = pct * player.duration;
});

menu.querySelectorAll("button").forEach(button => {
  button.addEventListener("click", () => {
    menu.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");

    Object.values(panels).forEach(panel => panel.classList.remove("open"));

    const target = button.dataset.panel;

    if(target === "backAction"){
      main.classList.remove("show");
      entry.style.display = "grid";
      requestAnimationFrame(() => {
        entry.style.opacity = "1";
        entry.style.pointerEvents = "auto";
      });
      menuOpen = false;
      menu.classList.remove("open");
      plusBtn.classList.remove("active");
      plusBtn.textContent = "+";
      player.pause();
      return;
    }

    panels[target].classList.add("open");
  });
});
</script>

</body>
</html>
